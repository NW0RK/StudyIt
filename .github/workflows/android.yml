name: Build installable Android APK
on:
  workflow_dispatch:
    inputs:
      library_url:
        description: 'Published library URL; leave blank for the default GitHub Pages URL'
        required: false
        type: string
      apk_run_id:
        description: 'Optional existing successful APK run ID; verify that APK without rebuilding'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: ${{ inputs.apk_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - name: Verify Expo native dependency compatibility
        run: npx expo install --check
        env:
          EXPO_OFFLINE: '1'
      - run: npm run content:build && npm run check
      - name: Configure shared library
        shell: bash
        env:
          INPUT_LIBRARY_URL: ${{ inputs.library_url }}
        run: |
          if [[ -n "$INPUT_LIBRARY_URL" ]]; then
            echo "EXPO_PUBLIC_LIBRARY_URL=$INPUT_LIBRARY_URL" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "EXPO_PUBLIC_LIBRARY_URL=https://${{ github.repository_owner }}.github.io/library" >> "$GITHUB_ENV"
          else
            echo "EXPO_PUBLIC_LIBRARY_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/library" >> "$GITHUB_ENV"
          fi
      - run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone preview APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: StudyIt-Android-preview
          path: android/app/build/outputs/apk/release/*.apk
  verify:
    needs: apk
    if: ${{ always() && (needs.apk.result == 'success' || (needs.apk.result == 'skipped' && inputs.apk_run_id != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: StudyIt-Android-preview
          path: android/app/build/outputs/apk/release
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyIt-Android-verification
          path: test-results/android/
